<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>__MSG_extensionName__</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1 data-i18n="popupTitle"></h1>
          <p id="countText"></p>
        </div>
        <div class="topbar-actions">
          <button id="randomPickButton" class="serendipity-launch-btn" type="button" data-i18n-aria-label="randomPickButton" title="随手读一篇 (随机回顾)">🎲</button>
          <button id="openSidePanelButton" class="sidepanel-launch-btn" type="button" data-i18n-aria-label="openSidePanelTitle" title="在浏览器侧边栏打开">◨ <span data-i18n="openSidePanelButton"></span></button>
          <button id="saveCurrentButton" class="primary" type="button" data-i18n="saveCurrentButton"></button>
        </div>
      </header>

      <section class="quick-add" data-i18n-aria-label="manualAddLabel">
        <input id="manualUrlInput" type="url" data-i18n-placeholder="manualUrlPlaceholder">
        <button id="manualAddButton" type="button" data-i18n="manualAddButton"></button>
      </section>

      <section class="controls" data-i18n-aria-label="filterLabel">
        <input id="searchInput" type="search" data-i18n-placeholder="searchPlaceholder">
        <select id="statusFilter" data-i18n-aria-label="statusFilterLabel">
          <option value="all" data-i18n="statusAll"></option>
          <option value="inbox" data-i18n="statusInbox"></option>
          <option value="done" data-i18n="statusDone"></option>
        </select>
      </section>

      <section id="tagFilters" class="tag-filters" data-i18n-aria-label="tagFilterLabel"></section>

      <section id="serendipityCard" class="serendipity-card" hidden data-i18n-aria-label="serendipityCardTitle">
        <div class="serendipity-head">
          <div class="serendipity-tag-wrap">
            <span class="serendipity-badge">🎲 <span data-i18n="serendipityBadge"></span></span>
            <span id="serendipityAge" class="serendipity-age"></span>
          </div>
          <button id="serendipityCloseButton" class="serendipity-close" type="button" data-i18n-aria-label="serendipityClose" title="收起">✕</button>
        </div>
        <div class="serendipity-content">
          <a id="serendipityTitle" class="serendipity-title" href="#" target="_blank" rel="noreferrer"></a>
          <p id="serendipityMeta" class="serendipity-meta"></p>
        </div>
        <div class="serendipity-actions">
          <button id="serendipityReadButton" class="primary serendipity-btn" type="button" data-i18n="serendipityReader"></button>
          <button id="serendipityOpenButton" class="serendipity-btn" type="button" data-i18n="serendipityOpen"></button>
          <button id="serendipityArchiveButton" class="serendipity-btn" type="button" data-i18n="serendipityArchive"></button>
          <button id="serendipityNextButton" class="serendipity-btn next-btn" type="button">🎲 <span data-i18n="serendipityPickAnother"></span></button>
        </div>
      </section>

      <section id="batchBar" class="batch-bar" hidden data-i18n-aria-label="batchBarLabel">
        <div class="batch-row">
          <button id="selectAllButton" type="button" data-i18n="selectAllButton"></button>
          <span id="selectionCount" class="selection-count"></span>
          <button id="exitBatchButton" type="button" data-i18n="exitBatchButton"></button>
        </div>
        <div class="batch-row batch-actions">
          <button id="batchTagButton" type="button" data-i18n="batchTagButton"></button>
          <button id="batchDoneButton" type="button" data-i18n="batchDoneButton"></button>
          <button id="batchDeleteButton" type="button" class="danger" data-i18n="deleteButton"></button>
        </div>
        <div id="batchTagRow" class="batch-row batch-tag-row" hidden>
          <input id="batchTagInput" type="text" data-i18n-placeholder="tagsPlaceholder">
          <button id="batchTagApplyButton" type="button" data-i18n="batchTagApplyButton"></button>
        </div>
      </section>

      <section id="message" class="message" hidden></section>
      <section id="list" class="list" aria-live="polite"></section>

      <footer class="footer">
        <button id="exportJsonButton" type="button" data-i18n="exportJsonButton"></button>
        <button id="exportMarkdownButton" type="button" data-i18n="exportMarkdownButton"></button>
        <button id="batchToggleButton" type="button" data-i18n="batchToggleButton"></button>
        <button id="clearDoneButton" type="button" data-i18n="clearDoneButton"></button>
        <button id="dashboardButton" type="button" class="primary footer-wide" data-i18n="openDashboardButton"></button>
      </footer>
    </main>

    <template id="itemTemplate">
      <article class="item">
        <div class="item-head">
          <input class="item-select" type="checkbox">
          <div class="item-title-wrap">
            <a class="item-title" target="_blank" rel="noreferrer"></a>
            <p class="item-url"></p>
          </div>
          <button class="pin-button" type="button"></button>
        </div>
        <p class="item-description"></p>
        <input class="item-tags" type="text" data-i18n-placeholder="tagsPlaceholder">
        <textarea class="item-note" rows="2" data-i18n-placeholder="notePlaceholder"></textarea>
        <div class="item-actions">
          <button class="reader-button" type="button" data-i18n="readerModeButton"></button>
          <button class="status-button" type="button"></button>
          <button class="markdown-button" type="button" data-i18n="copyMarkdownButton"></button>
          <button class="delete-button danger" type="button" data-i18n="deleteButton"></button>
        </div>
      </article>
    </template>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
