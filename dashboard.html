<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>__MSG_extensionName__</title>
    <link rel="stylesheet" href="dashboard.css">
  </head>
  <body>
    <main class="page">
      <header class="page-head">
        <h1 data-i18n="dashboardTitle"></h1>
        <p class="muted" data-i18n="dashboardSubtitle"></p>
        <p id="usageText" class="muted"></p>
      </header>

      <section class="card" data-i18n-aria-label="statOverviewTitle">
        <h2 data-i18n="statOverviewTitle"></h2>
        <div class="stat-grid">
          <div class="stat">
            <span id="statTotal" class="stat-num"></span>
            <span class="stat-label" data-i18n="statTotal"></span>
          </div>
          <div class="stat">
            <span id="statInbox" class="stat-num"></span>
            <span class="stat-label" data-i18n="statInbox"></span>
          </div>
          <div class="stat">
            <span id="statDone" class="stat-num"></span>
            <span class="stat-label" data-i18n="statDone"></span>
          </div>
          <div class="stat">
            <span id="statPinned" class="stat-num"></span>
            <span class="stat-label" data-i18n="statPinned"></span>
          </div>
          <div class="stat">
            <span id="statLast7" class="stat-num"></span>
            <span class="stat-label" data-i18n="statLast7Days"></span>
          </div>
        </div>
        <div class="top-lists">
          <div>
            <h3 data-i18n="topTagsTitle"></h3>
            <ul id="topTags"></ul>
          </div>
          <div>
            <h3 data-i18n="topSitesTitle"></h3>
            <ul id="topSites"></ul>
          </div>
        </div>
      </section>

      <section id="serendipityCard" class="card serendipity-dash-card" data-i18n-aria-label="serendipityCardTitle">
        <div class="card-head-row">
          <div>
            <h2 data-i18n="serendipityCardTitle"></h2>
            <p class="muted" data-i18n="serendipityCardDesc"></p>
          </div>
          <div class="serendipity-stats-pill">
            <span id="backlogCountText"></span>
          </div>
        </div>

        <div id="serendipityEmptyState" class="serendipity-empty" hidden>
          <p class="muted" data-i18n="serendipityEmpty"></p>
        </div>

        <div id="serendipityContent" class="serendipity-box">
          <div class="serendipity-box-header">
            <span class="serendipity-tag-label">🎲 <span data-i18n="serendipityBadge"></span></span>
            <span id="serendipityDaysBadge" class="serendipity-age-badge"></span>
          </div>
          <a id="serendipityMainTitle" class="serendipity-main-title" href="#" target="_blank" rel="noreferrer"></a>
          <p id="serendipityUrl" class="serendipity-item-url"></p>
          <div id="serendipityMetaRow" class="serendipity-meta-row"></div>
          <div class="row serendipity-btn-group">
            <button id="dashSerendipityReadBtn" type="button" class="primary" data-i18n="serendipityReader"></button>
            <button id="dashSerendipityOpenBtn" type="button" data-i18n="serendipityOpen"></button>
            <button id="dashSerendipityDoneBtn" type="button" data-i18n="serendipityArchive"></button>
            <button id="dashSerendipityNextBtn" type="button" class="serendipity-next-btn">🎲 <span data-i18n="serendipityPickAnother"></span></button>
          </div>
        </div>
      </section>

      <section class="card" data-i18n-aria-label="readerCardTitle">
        <h2 data-i18n="readerCardTitle"></h2>
        <p class="muted" data-i18n="readerCardDesc"></p>
        <div class="row">
          <button id="openReaderButton" type="button" class="primary" data-i18n="openReaderButton"></button>
        </div>
      </section>

      <section class="card" data-i18n-aria-label="aiCardTitle">
        <h2 data-i18n="aiCardTitle"></h2>
        <p class="muted" data-i18n="aiCardDesc"></p>
        <div class="row">
          <button id="openAiButton" type="button" class="primary" data-i18n="openAiButton"></button>
        </div>
      </section>

      <section class="card" data-i18n-aria-label="importTitle">
        <h2 data-i18n="importTitle"></h2>
        <p class="muted" data-i18n="importDesc"></p>
        <input id="importFile" type="file" accept=".json,application/json" hidden>
        <div class="row">
          <button id="importButton" type="button" data-i18n="importButton"></button>
        </div>
        <section id="dashMessage" class="message" hidden></section>
      </section>

      <section class="card" data-i18n-aria-label="manageTitle">
        <h2 data-i18n="manageTitle"></h2>
        <div class="row">
          <button id="copyAllMarkdownButton" type="button" data-i18n="copyAllMarkdownButton"></button>
          <button id="exportCsvButton" type="button" data-i18n="exportCsvButton"></button>
          <button id="exportBookmarksButton" type="button" data-i18n="exportBookmarksButton"></button>
          <button id="openSidePanelButton" type="button" data-i18n="openSidePanelButton"></button>
        </div>
      </section>

      <section class="card" data-i18n-aria-label="dashArticlesTitle">
        <div class="card-head-row">
          <h2 data-i18n="dashArticlesTitle"></h2>
          <div class="dash-filter-controls">
            <input id="dashSearchInput" type="search" data-i18n-placeholder="searchPlaceholder">
            <select id="dashStatusFilter" data-i18n-aria-label="statusFilterLabel">
              <option value="all" data-i18n="statusAll"></option>
              <option value="inbox" data-i18n="statusInbox"></option>
              <option value="done" data-i18n="statusDone"></option>
            </select>
          </div>
        </div>
        <p class="muted" data-i18n="dashArticlesDesc"></p>
        <div id="dashArticlesList" class="dash-articles-list"></div>
      </section>
    </main>

    <script src="shared.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
